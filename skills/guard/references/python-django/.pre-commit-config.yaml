# Ruff before the commit, on exactly the version `uv.lock` pins — a working copy, a hook
# and CI cannot disagree about what "clean" means. That is why the hooks are
# `repo: local` and not the upstream mirror (`astral-sh/ruff-pre-commit`): a mirror
# carries its own `rev:`, which somebody would have to keep equal to the lock file by
# hand, and two answers to one question are worse than none.
#
# The hook is a convenience for the working copy, not an authority: CI stays the place
# where the answer counts and does not run pre-commit. Install: `uv run pre-commit install`.
#
# `files:` is the scope of the Definition of Done — `src tests scripts`, nothing else.
#
# `--force-exclude` is load-bearing: pre-commit passes file names on the command line,
# and ruff applies `extend-exclude` (migrations) to a named file only with that flag.
default_install_hook_types: [pre-commit]
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --frozen ruff check --force-exclude
        language: system
        types_or: [python, pyi]
        files: ^(src|tests|scripts)/
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: uv run --frozen ruff format --check --force-exclude
        language: system
        types_or: [python, pyi]
        files: ^(src|tests|scripts)/
        require_serial: true
